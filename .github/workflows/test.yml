name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lydia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lydia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create application role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d lydia <<'SQL'
          CREATE ROLE lydia_app LOGIN PASSWORD 'lydia-test-password' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT, TEMPORARY, CREATE ON DATABASE lydia TO lydia_app;
          SQL

      - name: Validate RLS test role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 <<'SQL'
          SELECT rolname, rolsuper, rolbypassrls
          FROM pg_roles
          WHERE rolname = 'lydia_app';
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'lydia_app'
                AND rolsuper = false
                AND rolbypassrls = false
            ) THEN
              RAISE EXCEPTION 'lydia_app must be NOSUPERUSER and NOBYPASSRLS';
            END IF;
          END
          $$;
          SQL

      - name: Validate Phase 2 migration files
        run: |
          test -s database/schema_v2.sql
          test -s database/phase2_clinical.sql

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://lydia_app:lydia-test-password@127.0.0.1:5432/lydia
          DATABASE_URL: postgresql://lydia_app:lydia-test-password@127.0.0.1:5432/lydia
        run: pytest -q
