name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lydia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lydia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create application role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lydia_app LOGIN PASSWORD 'lydia-test-password' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT, TEMPORARY ON DATABASE lydia TO lydia_app;
          SQL

      - name: Validate RLS test role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'lydia_app' AND rolsuper = false AND rolbypassrls = false
            ) THEN
              RAISE EXCEPTION 'lydia_app must be NOSUPERUSER and NOBYPASSRLS';
            END IF;
          END $$;
          SQL

      - name: Validate migration files
        run: |
          test -s database/schema_v2.sql
          test -s database/phase2_clinical.sql
          test -s database/phase3_business.sql

      - name: Run Lydia database migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 -f database/schema_v2.sql
          psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 -f database/phase2_clinical.sql
          psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 -f database/phase3_business.sql

      - name: Grant test role table and sequence privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO lydia_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO lydia_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO lydia_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO lydia_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO lydia_app;
          SQL

      - name: Verify migrated tables and RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d lydia -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            required_table TEXT;
          BEGIN
            FOREACH required_table IN ARRAY ARRAY[
              'clinics','users','customers','staff','services','bookings','audit_logs',
              'journal_templates','journal_notes','consents','before_after_images',
              'products','inventory_movements','sales','sale_items','payments',
              'integration_connections','integration_events','report_snapshots'
            ] LOOP
              IF to_regclass('public.' || required_table) IS NULL THEN
                RAISE EXCEPTION 'Required Lydia table is missing: %', required_table;
              END IF;
            END LOOP;
          END $$;

          SELECT relname, relrowsecurity, relforcerowsecurity
          FROM pg_class
          WHERE relname IN (
            'users','customers','staff','services','bookings','audit_logs',
            'journal_templates','journal_notes','consents','before_after_images',
            'products','inventory_movements','sales','sale_items','payments',
            'integration_connections','integration_events','report_snapshots'
          )
          ORDER BY relname;
          SQL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run PostgreSQL integration and unit tests
        env:
          TEST_DATABASE_URL: postgresql://lydia_app:lydia-test-password@127.0.0.1:5432/lydia
          DATABASE_URL: postgresql://lydia_app:lydia-test-password@127.0.0.1:5432/lydia
        run: pytest -q
