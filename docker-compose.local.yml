services:
  backend:
    build:
      context: ./backend
    container_name: lydia-backend
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: lydia-local-development-secret-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_MINUTES: 60
      DATABASE_URL: postgresql://lydia_app:lydia-test-password@host.docker.internal:5432/lydia
      DB_POOL_MAX: 10
      DB_COMMAND_TIMEOUT: 10
      CORS_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    container_name: lydia-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
