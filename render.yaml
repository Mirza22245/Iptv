services:
  - type: web
    name: lydia-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lydia-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mirza22245.github.io
      - key: LYDIA_SEED_DEMO
        value: "true"
    buildFilter:
      paths:
        - backend/**
        - database/**
        - render.yaml

databases:
  - name: lydia-db
    databaseName: lydia
    user: lydia
